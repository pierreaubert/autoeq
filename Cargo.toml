[workspace]
resolver = "3"
members = [
    "crates/autoeq-core",
    "crates/autoeq-artifacts",
    "crates/autoeq-fir",
    "crates/autoeq-plot",
    "crates/autoeq-measurements",
    "crates/autoeq-objective",
    "crates/autoeq-optim",
    "crates/autoeq-optim-types",
    "crates/autoeq-workflow",
    "crates/autoeq-cli",
    "crates/roomeq-model",
    "crates/roomeq-dsp",
    "crates/roomeq-engine",
    "crates/roomeq-export",
    "crates/roomeq-quality",
    "crates/roomeq-qa",
    "crates/roomeq-cli",
    "crates/roomeq-analysis",
    "crates/roomeq-synthetic",
    "crates/roomeq-workflow",
    "crates/autoeq-qa",
    "crates/autoeq-report-wasm",
    "crates/autoeq-report-wasm-shell",
    "crates/autoeq-report-gpui",
]
# Local GPUI demos have a separate workspace so backend installs do not
# resolve their sibling checkout dependencies.
exclude = ["crates/autoeq-gpui-examples"]
# Ordinary library development set (refactor-20261025 Phase 1): bare
# `cargo build/test/check` selects these libraries. CLI, QA, renderer, and
# shell packages are built explicitly (`-p`, `--workspace`, or a Justfile
# lane); `default-members` does not restrict explicit `--workspace`.
default-members = [
    "crates/autoeq-core",
    "crates/autoeq-artifacts",
    "crates/autoeq-fir",
    "crates/autoeq-plot",
    "crates/autoeq-measurements",
    "crates/autoeq-objective",
    "crates/autoeq-optim",
    "crates/autoeq-optim-types",
    "crates/autoeq-workflow",
    "crates/roomeq-model",
    "crates/roomeq-analysis",
    "crates/roomeq-quality",
    "crates/roomeq-dsp",
    "crates/roomeq-engine",
    "crates/roomeq-export",
    "crates/roomeq-synthetic",
    "crates/roomeq-workflow",
]

[workspace.package]
version = "0.5.78"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
perf = { level = "warn", priority = -1 }

[workspace.dependencies]
autoeq-core = { path = "crates/autoeq-core", version = "0.5" }
autoeq-artifacts = { path = "crates/autoeq-artifacts", version = "0.5" }
autoeq-fir = { path = "crates/autoeq-fir", version = "0.5" }
autoeq-plot = { path = "crates/autoeq-plot", version = "0.5" }
autoeq-measurements = { path = "crates/autoeq-measurements", version = "0.5" }
autoeq-objective = { path = "crates/autoeq-objective", version = "0.5" }
autoeq-optim = { path = "crates/autoeq-optim", version = "0.5" }
autoeq-optim-types = { path = "crates/autoeq-optim-types", version = "0.5" }
autoeq-workflow = { path = "crates/autoeq-workflow", version = "0.5" }
autoeq-cli = { path = "crates/autoeq-cli", version = "0.5" }
autoeq-report-wasm = { path = "crates/autoeq-report-wasm", version = "0.5" }
autoeq-report-wasm-shell = { path = "crates/autoeq-report-wasm-shell", version = "0.5" }
autoeq-report-gpui = { path = "crates/autoeq-report-gpui", version = "0.5" }
roomeq-model = { path = "crates/roomeq-model", version = "0.5.15" }
roomeq-dsp = { path = "crates/roomeq-dsp", version = "0.5" }
roomeq-engine = { path = "crates/roomeq-engine", version = "0.5.84" }
roomeq-export = { path = "crates/roomeq-export", version = "0.5.9" }
roomeq-quality = { path = "crates/roomeq-quality", version = "0.5" }
roomeq-qa = { path = "crates/roomeq-qa", version = "0.5" }
roomeq-cli = { path = "crates/roomeq-cli", version = "0.5.9" }
roomeq-analysis = { path = "crates/roomeq-analysis", version = "0.5" }
roomeq-synthetic = { path = "crates/roomeq-synthetic", version = "0.5" }
roomeq-workflow = { path = "crates/roomeq-workflow", version = "0.5.36" }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
build_html = "2.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
criterion = "0.8.2"
csv = "1.4"
directories = "6"
env_logger = "0.11"
libm = { version = "=0.2.16", default-features = false }
log = "0.4.28"
num_cpus = "1.17"
num-complex = "0.4"
nalgebra = { package = "sotf-nalgebra", git = "https://github.com/pierreaubert/sotf-3rdparties",  version = "0.35", default-features = false, features = ["std"] }
metaheuristics-nature = { package = "sotf-metaheuristics-nature",  version = "10.1", git = "https://github.com/pierreaubert/sotf-3rdparties" }
rustfft = "6.4"
hound = "3.5"
# Reports are self-contained HTML+WASM documents (no Plotly dependency).
rand = "0.10.2"
rand_chacha = "0.10.0"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_ignored = "0.1.14"
serde_json = "1.0"
sha2 = "0.11"
schemars = "1.2"
strsim = "0.11"
thiserror = "2.0.17"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "io-util", "process", "signal"] }
urlencoding = "2.1"
zip = { version = "8", default-features = false }
tempfile = "3.23"
assert_fs = "1.0"
proptest = { version = "1.9", default-features = false, features = ["std"] }
serial_test = "4"
wide = "0.6.1"

# Shared report primitives from the sibling math-audio workspace.
math-iir-fir = { version = "0.5", path = "../math-audio/crates/math-iir-fir" }
math-dsp = { version = "0.5", path = "../math-audio/crates/math-dsp" }
math-optimisation = { version = "0.5", path = "../math-audio/crates/math-optimisation" }
math-rir = { version = "0.5.12", path = "../math-audio/crates/math-rir" }
sofa-reader = { version = "0.2", git = "https://github.com/pierreaubert/sofa-reader" }

# Core numerical computing
ndarray = { version = "0.17", default-features = false, features = ["rayon", "serde"] }
oxiblas-ndarray = "0.2.2"

rayon = "1.11"

[profile.dev]
opt-level = 0
# Line tables only: gives file:line stack traces, but skips 10GB+ of variable/type DWARF info that chokes the linker.
debug = "line-tables-only"

# Keep debug symbols in separate .dwo files so the linker never touches them
split-debuginfo = "unpacked"

# Do NOT strip; backtraces will still work
strip = "none"

# -------------------------------------------------------------------
# 2. DEPENDENCY OVERRIDES (The Secret Weapon)
# Heavily optimize external dependencies (tokio, serde, etc.) in dev mode.
# They take time to compile ONCE, but sccache caches them forever,
# and your 50 binaries will run 10x faster during QA/tests.
# -------------------------------------------------------------------
[profile.dev.package."*"]
opt-level = 3

[profile.release]
# `release` is the everyday optimised profile — used by CI, `just prod-*`,
# benchmarks, and local release iteration. Thin LTO keeps cross-crate inlining
# without the serial bottleneck of fat LTO, and 14 codegen units balance
# parallelism with optimiser visibility.
opt-level = 3
lto = "thin"
codegen-units = 14
panic = "abort"           # Removes unwind tables, saving ~15% binary size and link work
debug = false             # Omit debug symbols in release binaries
strip = "debuginfo"       # Strip debug symbols, keep symbol table

# Development test profile (refactor-20261025 Phase 1): the `just test`
# and `just test-crate` lanes compile with `--cargo-profile test` so a
# library edit gets fast codegen (many codegen units, no LTO) while
# keeping line tables for stack traces. Candidate values from the plan;
# compare against opt-level 2 with scripts/bench_build.py before tuning.
[profile.test]
opt-level = 1
lto = "off"
codegen-units = 256
incremental = true
debug = "line-tables-only"
strip = "none"

# QA profile (refactor-20261025 Phase 1): one consistent optimized
# artifact set for the complete `just ntest` lane and executable tests,
# replacing the old release-binary prebuild plus separate test build.
# Inherits `release` numerics but unwinds (tests need it) and uses more
# codegen units for parallel codegen; shipped `release`/`dist` are
# unchanged.
[profile.qa]
inherits = "release"
opt-level = 3
lto = "off"
codegen-units = 64
incremental = true
panic = "unwind"
debug = "line-tables-only"
strip = "none"

# `dist` is the "cut a release" profile. Inherits everything from `release`
# and tightens for maximum runtime performance at the cost of much longer
# compile time. Use via `cargo build --profile dist` — artifacts land in
# `target/dist/` instead of `target/release/`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

