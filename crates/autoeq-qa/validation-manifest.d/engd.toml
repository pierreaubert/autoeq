# autoeq-qa validation manifest fragment: engd group (RE13-RE20, RE23, RE24).
#
# Merged into validation-manifest.toml by the QA owner. Stems are globally
# unique; ids are autoeq-qa.<stem-with-dashes>.v1. Every case resolves its
# reference through autoeq_qa::require_reference and emits QA_RESULT.
# Tolerance classes follow reviews/catalogue-20260923.md (A/N/L/B/X/I).

[[case]]
id = "autoeq-qa.re13-mso-seat-response.v1"
family = "RE13"
owner = "roomeq-engine"
script = "re13_mso_seat_response.wls"
golden = "re13_mso_seat_response.json"
test = "wolfram_re13_mso_seat_response"
tolerance = "SPL absolute error <= 1e-9 dB; complex phasor relative error <= 1e-12 (phase compared unwrap-invariant)"
tolerance_kind = "abs"
tier = "smoke"

