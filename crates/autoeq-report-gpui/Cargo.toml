[package]
publish = false
name = "autoeq-report-gpui"
version = "0.5.0"
edition = "2024"
description = "Full-GPUI enhanced report viewer for AutoEQ (WebGPU-gated)"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
autoeq-report-wasm = { workspace = true }

[features]
native = ["dep:gpui", "dep:gpui-ui-kit"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gpui-ui-kit = { version = "0.11", git = "https://github.com/pierreaubert/gpui-toolkit", default-features = false, optional = true, rev = "36bb357e8d17667c6dc0bce7c2443223c9b9070e" }
gpui = { package = "sotf-gpui-toolkit-gpui", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.2.3", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCollection",
    "HtmlElement",
    "HtmlCanvasElement",
    "Node",
    "console",
] }
gpui = { package = "sotf-gpui-toolkit-gpui", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.2.3", default-features = false }
gpui_web = { package = "sotf-gpui-toolkit-gpui-web", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.1" }
