[package]
name = "autoeq-measurements"
version = "0.5.4"
edition = "2024"
description = "AutoEQ measurement loading and preprocessing"
license = "GPL-3.0-or-later"
documentation = "https://docs.rs/autoeq-measurements"
homepage = "https://github.com/pierreaubert/autoeq"

[lints]
workspace = true

[features]
default = ["api"]
api = []

[dependencies]
autoeq-core = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
directories = { workspace = true }
log = { workspace = true }
ndarray = { workspace = true }
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
strsim = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
