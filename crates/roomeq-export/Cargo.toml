[package]
name = "roomeq-export"
version = "0.5.9"
edition = "2024"
description = "RoomEQ external DSP exporters and artifact packaging"
license = "GPL-3.0-or-later"
documentation = "https://docs.rs/roomeq-export"
homepage = "https://github.com/pierreaubert/autoeq"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
autoeq-core = { workspace = true }
roomeq-dsp = { workspace = true }
roomeq-quality = { workspace = true }
anyhow = { workspace = true }
hound = { workspace = true }
math-iir-fir = { workspace = true }
roomeq-model = { workspace = true }
# Preserve exact filter metadata when reading the serialized processing chain.
serde_json = { workspace = true, features = ["float_roundtrip"] }
zip = { workspace = true }

[dev-dependencies]
num-complex = { workspace = true }
tempfile = { workspace = true }
