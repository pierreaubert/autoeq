[package]
name = "autoeq-optim"
version = "0.5.58"
edition = "2024"
description = "AutoEQ objectives, constraints, and optimizer backends"
license = "GPL-3.0-or-later"
documentation = "https://docs.rs/autoeq-optim"
homepage = "https://github.com/pierreaubert/autoeq"

[lints]
workspace = true

[features]
# Retained as a compatibility marker. RoomEQ configuration adapts to
# `OptimParams` in `roomeq-model`, preserving the lower-layer dependency
# direction (`roomeq-model -> autoeq-optim`).
roomeq-adapter = []

[dependencies]
autoeq-core = { workspace = true }
autoeq-measurements = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
math-iir-fir = { workspace = true }
math-dsp = { workspace = true }
math-optimisation = { workspace = true }
ndarray = { workspace = true }
num-complex = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
metaheuristics-nature = { workspace = true }

[dev-dependencies]
criterion = "0.8.2"
rayon = "1.11"
stats_alloc = "0.1.10"

[[bench]]
name = "objective_hot_path"
harness = false
