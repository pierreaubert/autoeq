[package]
publish = false
name = "roomeq-qa"
version = "0.5.68"
edition = "2024"
description = "RoomEQ QA scenario matrices, runners, scorecards, and command implementations"
license = "GPL-3.0-or-later"
documentation = "https://docs.rs/roomeq-qa"
homepage = "https://github.com/pierreaubert/autoeq"

[lints]
workspace = true

[dependencies]
autoeq-plot = { workspace = true }
anyhow = { workspace = true }
autoeq-core = { workspace = true }
autoeq-optim = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
math-iir-fir = { workspace = true }
ndarray = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
roomeq-engine = { workspace = true }
roomeq-model = { workspace = true }
roomeq-quality = { workspace = true }
roomeq-synthetic = { workspace = true }
roomeq-workflow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
hound = { workspace = true }
autoeq-measurements = { workspace = true }
roomeq-analysis = { workspace = true }

[[bin]]
name = "roomeq-fuzzer"
path = "src/bin/roomeq-fuzzer.rs"
test = false
bench = false

[[bin]]
name = "roomeq-qa-quality"
path = "src/bin/roomeq-qa-quality.rs"
test = false
bench = false

[[bin]]
name = "roomeq-qa-coverage"
path = "src/bin/roomeq-qa-coverage.rs"
test = false
bench = false

[[bin]]
name = "roomeq-qa-features"
path = "src/bin/roomeq-qa-features.rs"
test = false
bench = false

[[bin]]
name = "roomeq-qa-synthetic"
path = "src/bin/roomeq-qa-synthetic.rs"
test = false
bench = false

[[bin]]
name = "roomeq-qa-acoustic"
path = "src/bin/roomeq-qa-acoustic.rs"
test = false
bench = false
