[package]
publish = false
name = "autoeq-cli"
version = "0.5.3"
edition = "2024"
description = "AutoEQ command-line parsing and user-facing orchestration"
license = "GPL-3.0-or-later"
documentation = "https://docs.rs/autoeq-cli"
homepage = "https://github.com/pierreaubert/autoeq"

[lints]
workspace = true

[features]
default = []

[dependencies]
autoeq-optim = { workspace = true }
autoeq-optim-types = { workspace = true }
autoeq-core = { workspace = true }
anyhow = { workspace = true }
autoeq-plot = { workspace = true }
autoeq-workflow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
ndarray = { workspace = true }
num_cpus = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
autoeq-objective = { workspace = true }
autoeq-measurements = { workspace = true }
proptest = { workspace = true }
roomeq-model = { workspace = true }
assert_fs = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "autoeq"
path = "src/bin/autoeq.rs"
test = false
bench = false

[[bin]]
name = "benchmark-autoeq-speaker"
path = "src/bin/benchmark-autoeq-speaker.rs"
test = false
bench = false

[[bin]]
name = "autoeq-download-speakers"
path = "src/bin/autoeq-download-speakers.rs"
test = false
bench = false
