# core1 fragment: autoeq-core families C02, C04, C05.
# Merged into validation-manifest.toml by the manifest owner; stems are
# globally unique. Tolerance classes per reviews/catalogue-20260923.md.

[[case]]
id = "autoeq-qa.c02-peq-layouts.v1"
family = "C02"
owner = "autoeq-core"
script = "c02_peq_layouts.wls"
golden = "c02_peq_layouts.json"
test = "wolfram_c02_peq_layouts"
tolerance = "complex relative error <= 1e-9"
tolerance_kind = "rel"
tier = "smoke"

