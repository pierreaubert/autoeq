[package]
name = "autoeq-report-gpui"
version = "0.5.0"
edition = "2024"
description = "Full-GPUI enhanced report viewer for AutoEQ (WebGPU-gated)"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
autoeq-report-wasm = { workspace = true }

# GPUI stack is wasm-only: the native build keeps just the explorer model
# (schema types + statistics), so `cargo check` on the host stays light.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCollection",
    "HtmlElement",
    "HtmlCanvasElement",
    "Node",
    "console",
] }
gpui = { package = "gpui-toolkit-gpui", path = "../../../gpui-toolkit/crates/3rdparties/gpui", version = "0.2.3", default-features = false }
gpui_web = { package = "gpui-toolkit-gpui-web", path = "../../../gpui-toolkit/crates/3rdparties/gpui_web", version = "0.1.1" }
