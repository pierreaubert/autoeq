[package]
name = "autoeq-objective"
version = "0.5.0"
edition = "2024"
description = "AutoEQ objective-function evaluation: losses, objective data, and evaluation budgets"
license = "GPL-3.0-or-later"
documentation = "https://docs.rs/autoeq-objective"
homepage = "https://github.com/pierreaubert/autoeq"

[lints]
workspace = true

[features]
# Compatibility re-exports for explicit network-enabled measurement access.
api = ["autoeq-measurements/api"]

[dependencies]
autoeq-core = { workspace = true }
autoeq-measurements = { workspace = true }
autoeq-optim-types = { workspace = true }
log = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
ndarray = { workspace = true }
num-complex = { workspace = true }
rayon = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
autoeq-report-wasm = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[[example]]
name = "headphone_loss_demo"
path = "examples/headphone_loss_demo.rs"
test = false

[[example]]
name = "headphone_loss_validation"
path = "examples/headphone_loss_validation.rs"
test = false

[[bench]]
name = "objective_hot_path"
harness = false
