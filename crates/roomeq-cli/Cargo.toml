[package]
publish = false
name = "roomeq-cli"
version = "0.5.9"
edition = "2024"
description = "RoomEQ command-line parsing and user-facing orchestration"
license = "GPL-3.0-or-later"
documentation = "https://docs.rs/roomeq-cli"
homepage = "https://github.com/pierreaubert/autoeq"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
num-complex = { workspace = true }
autoeq-optim = { workspace = true }
roomeq-engine = { workspace = true }
roomeq-export = { workspace = true }
roomeq-model = { workspace = true }
roomeq-workflow = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
math-rir = { workspace = true }
math-dsp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }

[dev-dependencies]
autoeq-core = { workspace = true }
autoeq-measurements = { workspace = true }
autoeq-objective = { workspace = true }
ndarray = { workspace = true }

[dependencies.hound]
workspace = true
[dependencies.sha2]
workspace = true

[[bin]]
name = "roomeq"
path = "src/bin/roomeq.rs"
test = false
bench = false

[[bin]]
name = "convert-recording"
path = "src/bin/convert-recording.rs"
test = false
bench = false
