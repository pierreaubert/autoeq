[package]
name = "autoeq"
version.workspace = true
description = "Automatic equalization for speakers, headphones and rooms!"
edition = "2024"
keywords = ["audio", "dsp", "eq"]
categories = ["multimedia::audio"]
repository = "https://github.com/pierreaubert/autoeq"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
license = "GPL-3.0-or-later"
# Keep the published crate under crates.io's size cap. The excluded paths are
# QA recordings, generated test fixtures, helper shell scripts, and editor
# backups — none are needed to compile the library or the user-facing
# binaries. The QA-only `roomeq-qa-features` binary and the
# `roomeq_generated_data_test` integration test will fail at runtime against
# a published copy because their fixtures are absent; they are meant to run
# from a workspace checkout.
exclude = [
    "data_tests/**",
    "data_generated/**",
    "scripts/**",
    "*.mdat",
    "**/*.mdat",
    "*~",
    "**/*~",
]

[workspace]
resolver = "3"
members = [
    ".",
    "crates/autoeq-core",
    "crates/autoeq-artifacts",
    "crates/autoeq-fir",
    "crates/autoeq-plot",
    "crates/autoeq-measurements",
    "crates/autoeq-optim",
    "crates/autoeq-workflow",
    "crates/autoeq-cli",
    "crates/roomeq-model",
    "crates/roomeq-engine",
    "crates/roomeq-export",
    "crates/roomeq-quality",
    "crates/roomeq-qa",
    "crates/roomeq-cli",
    "crates/roomeq-analysis",
    "crates/roomeq-synthetic",
    "crates/roomeq-workflow",
    "crates/autoeq-qa",
    "crates/autoeq-report-wasm",
    "crates/autoeq-report-wasm-shell",
    "crates/autoeq-report-gpui",
]
# Local GPUI demos have a separate workspace so backend installs do not
# resolve their sibling checkout dependencies.
exclude = ["crates/autoeq-gpui-examples"]

[workspace.package]
version = "0.5.74"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
perf = { level = "warn", priority = -1 }

[workspace.dependencies]
autoeq-core = { path = "crates/autoeq-core", version = "0.5" }
autoeq-artifacts = { path = "crates/autoeq-artifacts", version = "0.5" }
autoeq-fir = { path = "crates/autoeq-fir", version = "0.5" }
autoeq-plot = { path = "crates/autoeq-plot", version = "0.5" }
autoeq-measurements = { path = "crates/autoeq-measurements", version = "0.5" }
autoeq-optim = { path = "crates/autoeq-optim", version = "0.5" }
autoeq-workflow = { path = "crates/autoeq-workflow", version = "0.5" }
autoeq-cli = { path = "crates/autoeq-cli", version = "0.5" }
autoeq-report-wasm = { path = "crates/autoeq-report-wasm", version = "0.5" }
autoeq-report-wasm-shell = { path = "crates/autoeq-report-wasm-shell", version = "0.5" }
autoeq-report-gpui = { path = "crates/autoeq-report-gpui", version = "0.5" }
roomeq-model = { path = "crates/roomeq-model", version = "0.5" }
roomeq-engine = { path = "crates/roomeq-engine", version = "0.5" }
roomeq-export = { path = "crates/roomeq-export", version = "0.5" }
roomeq-quality = { path = "crates/roomeq-quality", version = "0.5" }
roomeq-qa = { path = "crates/roomeq-qa", version = "0.5" }
roomeq-cli = { path = "crates/roomeq-cli", version = "0.5" }
roomeq-analysis = { path = "crates/roomeq-analysis", version = "0.5" }
roomeq-synthetic = { path = "crates/roomeq-synthetic", version = "0.5" }
roomeq-workflow = { path = "crates/roomeq-workflow", version = "0.5" }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
build_html = "2.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
criterion = "0.8.2"
csv = "1.4"
directories = "6"
env_logger = "0.11"
log = "0.4.28"
num_cpus = "1.17"
num-complex = "0.4"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
metaheuristics-nature = { version = "10.1", git = "https://github.com/pierreaubert/metaheuristics-nature-rs.git", rev = "4f0b603c521e0b4e20239c827f1a0975442bb740" }
rustfft = "6.4"
hound = "3.5"
# Reports are self-contained HTML+WASM documents (no Plotly dependency).
rand = "0.10.2"
rand_chacha = "0.10.0"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_ignored = "0.1.14"
serde_json = "1.0"
sha2 = "0.11"
schemars = "1.2"
strsim = "0.11"
thiserror = "2.0.17"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "io-util", "process", "signal"] }
urlencoding = "2.1"
zip = { version = "8", default-features = false }
tempfile = "3.23"
assert_fs = "1.0"
proptest = { version = "1.9", default-features = false, features = ["std"] }
serial_test = "4"
wide = "0.6.1"

# Shared report primitives from the sibling math-audio workspace.
math-iir-fir = { version = "0.5", path = "../math-audio/crates/math-iir-fir" }
math-dsp = { version = "0.5", path = "../math-audio/crates/math-dsp" }
math-optimisation = { version = "0.5", path = "../math-audio/crates/math-optimisation" }
math-rir = { version = "0.5", path = "../math-audio/crates/math-rir" }
sofa-reader = { version = "0.2", path = "../sofa-reader" }

# Core numerical computing
ndarray = { version = "0.17", default-features = false, features = ["rayon", "serde"] }
oxiblas-ndarray = "0.2.2"

rayon = "1.11"

[dependencies]
autoeq-core = { workspace = true }
autoeq-artifacts = { workspace = true }
autoeq-fir = { workspace = true }
autoeq-plot = { workspace = true }
