# autoeq-qa validation manifest fragment: optimc group (O07-O12).
#
# Each case pairs a `.wls` oracle with a checked-in engine golden and a
# `tests/wolfram_<stem>.rs` comparison target. Tolerance classes follow
# reviews/catalogue-20260923.md: A = direct f64 algebra, X = exact
# support/decision checks.

[[case]]
id = "autoeq-qa.o07-crossover-sum.v1"
family = "O07"
owner = "autoeq-optim"
script = "o07_crossover_sum.wls"
golden = "o07_crossover_sum.json"
test = "wolfram_o07_crossover_sum"
tolerance = "[A] complex relative error <= 1e-9; combined dB absolute error <= 1e-8 dB"
tolerance_kind = "rel"
tier = "smoke"

[[case]]
id = "autoeq-qa.o08-joint-multisub.v1"
family = "O08"
owner = "autoeq-optim"
script = "o08_joint_multisub.wls"
golden = "o08_joint_multisub.json"
test = "wolfram_o08_joint_multisub"
tolerance = "[A] absolute error <= 1e-9 dB^2 on variation/output_drive/target_error/total"
tolerance_kind = "abs"
tier = "smoke"

[[case]]
id = "autoeq-qa.o09-group-delay.v1"
