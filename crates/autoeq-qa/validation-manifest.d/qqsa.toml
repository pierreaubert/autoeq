# qqsa group: quality/QA/synthetic cross-validation (smoke tier).
# Families RQ05, RQ06, RQ08, QA01, QA02, QA03, RS01, RS02, RS03.
# Each entry below is one comparison block with its oracle script,
# engine golden, Rust comparison test, tolerance, and tier.

[[case]]
id = "autoeq-qa.rq05-capture-alignment.v1"
family = "RQ05"
owner = "roomeq-quality"
script = "rq05_capture_alignment.wls"
golden = "rq05_capture_alignment.json"
test = "wolfram_rq05_capture_alignment"
tolerance = "A: absolute error <= 1e-9 dB (residual peak, mean change, output loss); exact support/binding decisions"
tolerance_kind = "abs"
tier = "smoke"

[[case]]
id = "autoeq-qa.rq06-tone-render.v1"
