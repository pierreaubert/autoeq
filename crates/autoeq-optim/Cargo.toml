[package]
name = "autoeq-optim"
version = "0.5.64"
edition = "2024"
description = "AutoEQ objectives, constraints, and optimizer backends"
license = "GPL-3.0-or-later"
documentation = "https://docs.rs/autoeq-optim"
homepage = "https://github.com/pierreaubert/autoeq"

[lints]
workspace = true

[features]
# Compatibility re-exports for explicit network-enabled measurement access.
api = ["autoeq-measurements/api"]
# Preserve the shipping registry while allowing built-in-only library builds.
default = ["backend-metaheuristics"]
backend-metaheuristics = ["dep:metaheuristics-nature"]
# Retained as a compatibility marker. RoomEQ configuration adapts to
# the optimizer's `OptimParams` at the workflow boundary; shared
# serialized evidence lives in `autoeq-optim-types` so this crate
# does not depend on `roomeq-model`.
roomeq-adapter = []

[dependencies]
autoeq-core = { workspace = true }
autoeq-measurements = { workspace = true }
log = { workspace = true }
math-iir-fir = { workspace = true }
math-dsp = { workspace = true }
math-optimisation = { workspace = true }
ndarray = { workspace = true }
num-complex = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
autoeq-objective = { workspace = true }
autoeq-optim-types = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
metaheuristics-nature = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.8.2"
rayon = "1.11"
stats_alloc = "0.1.10"

[[bench]]
name = "solver_generation"
harness = false
