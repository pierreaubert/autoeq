[package]
name = "autoeq-report-wasm"
version = "0.5.1"
edition = "2024"
autobins = false
description = "HTML+WASM report renderer for AutoEQ (Plotly replacement, gpui-toolkit based)"
license = "GPL-3.0-or-later"

[[bin]]
name = "report-producer"
path = "src/bin/report_producer.rs"

# Plain rlib: the cdylib shell lives in autoeq-report-wasm-shell. A
# cdylib+rlib crate linked by host code is built twice under
# `cargo test --release` (panic=abort vs unwind units) with identical
# output filenames, and parallel rustc invocations race on them
# (cargo#6313). Keep it that way.
[lints]
workspace = true

[dependencies]
autoeq-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.23"
rustfft = { workspace = true }
csv = { workspace = true }
# grid.rs uses d3rs::surface, which gpui-d3rs gates behind its "gpui"
# feature. Declare it here instead of relying on feature unification
# from elsewhere in the graph (nothing else enables it).
d3rs = { package = "gpui-d3rs", version = "0.10", git = "https://github.com/pierreaubert/gpui-toolkit", default-features = false, features = ["gpui"] }
