name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-and-test:
    name: Check, Clippy and Unit Tests
    runs-on: ubuntu-latest
    outputs:
      crate-test-packages: ${{ steps.crate-test-matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check crate-partition architecture
        run: |
          python3 -m unittest scripts/test_check_crate_partition.py
          python3 scripts/check_crate_partition.py --baseline-ref "${{ github.event.pull_request.base.sha }}"

      - name: cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Check RoomEQ schema baselines
        run: python3 scripts/check_roomeq_schema_baselines.py

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Prepare crate test matrix
        id: crate-test-matrix
        run: echo "packages=$(python3 scripts/run_crate_test_matrix.py --list-json)" >> "$GITHUB_OUTPUT"

  crate-unit-tests:
    name: Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: check-and-test
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check-and-test.outputs.crate-test-packages) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.package }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run focused crate tests
        run: python3 scripts/run_crate_test_matrix.py --package "${{ matrix.package }}" --release

  qa-roomeq-ci:
    name: RoomEQ CI QA Gate
    runs-on: ubuntu-latest
    needs: crate-unit-tests
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Run RoomEQ CI QA
        run: just qa-roomeq-ci

  coverage-gate:
    name: Library Unit-Test Coverage Gate (90 %)
    runs-on: ubuntu-latest
    needs: crate-unit-tests
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Run coverage gate
        run: just qa-roomeq-coverage-gate
