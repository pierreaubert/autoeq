[env]
# macOS-specific configuration
MACOSX_DEPLOYMENT_TARGET = "15.0"

# Disabled: -Zthreads is nightly-only and the pinned toolchain is stable
# 1.92.0, so any cargo invocation fails while this is set. (Uncomment to
# restore: RUSTFLAGS = "-Zthreads=8".)
# RUSTFLAGS = "-Zthreads=8"

[build]
# No workspace-wide target-cpu: `native` here silently applies to any
# target without an explicit section below and ships build-machine
# instructions (AMD SSE4a from a Zen builder -> SIGILL on every Intel
# CPU, sotf#246). Every shipped target pins its own baseline below;
# anything unlisted builds for the portable generic CPU (fail-safe).

# wasm32: pin the standard wasm feature set explicitly for this target.
# Without `reference-types`, wasm-bindgen omits its externref runtime
# and its CLI refuses the module ("failed to find the
# `__wbindgen_externref_table_dealloc` function").
[target.wasm32-unknown-unknown]
rustflags = [
  "-C",
  "target-feature=+bulk-memory,+mutable-globals,+reference-types,+sign-ext",
]
# jobs intentionally unset: cargo defaults to the logical CPU count
# (14 on macOS, 64 on the Linux EPYC), which is what we want per host.
# Disabled: sccache is not installed in this environment; re-enable where
# the wrapper exists. (Uncomment to restore: rustc-wrapper = "sccache".)
# rustc-wrapper = "sccache"

# macOS Apple Silicon (M1-M5) - using Accelerate framework
[target.aarch64-apple-darwin]
rustflags = [
  "-C", 'target-cpu=native',
  "-C", 'target-feature=+neon',
  "-C", "link-arg=-mmacosx-version-min=15.0",
  # cargo does not find them by default
  "-C", "link-arg=-framework",
  "-C", "link-arg=Accelerate",
  "-C", "link-arg=-L /Applications/Xcode.app/Contents/Frameworks",
  # for clang but why?
  "-C", "link-arg=-L /opt/homebrew/Cellar/llvm/23.1.1_1/lib"
]

# macOS Intel - using Accelerate framework, untested
[target.x86_64-apple-darwin]
rustflags = [
  "-C", "target-feature=+sse,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2",
  "-C", "link-arg=-mmacosx-version-min=15.0",
  "-C", "link-arg=-framework", "-C", "link-arg=Accelerate"
]

# ----------------------------------------------------------------------
# Linux x86 use mold
# ----------------------------------------------------------------------

[target.x86_64-unknown-linux-gnu]
# Use mold for lightning-fast parallel linking
linker = "clang"
rustflags = [
  "-C", "link-arg=-fuse-ld=mold",  # Force the mold linker
  # Portable x86-64-v2 baseline for shipped binaries. Floor hardware
  # is Apollo Lake (Celeron J3455): full v2 set, no AVX at all, so no
  # AVX/AVX2/FMA/BMI instruction may appear outside runtime-dispatched
  # kernels. target-cpu=native on the AMD release builder emitted
  # AMD-only SSE4a and SIGILLed on every Intel CPU (sotf#246). DSP
  # SIMD kernels are runtime-dispatched, so modern CPUs keep their
  # AVX2/FMA paths.
  "-C", "target-cpu=x86-64-v2",
  "-C", "symbol-mangling-version=v0", # Faster mangling, better demangling
]

# Linux ARM64 configuration
[target.aarch64-unknown-linux-gnu]
rustflags = [
  "-C", 'target-feature=+neon'
]

# Windows MSVC x86_64 configuration
[target.x86_64-pc-windows-msvc]
rustflags = [
  # Windows typically uses Intel MKL or OpenBLAS through vcpkg
  # "-C", "-DCMAKE_TOOLCHAIN_FILE=C:/Users/pierr/source/repos/microsoft/vcpkg/scripts/buildsystems/vcpkg.cmake",
  "-C", "target-feature=+sse,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2"
]

# Windows MSVC ARM configuration
[target.aarch64-pc-windows-msvc]
rustflags = [
  "-C", 'target-feature=+neon',
]

# Linux x86_64 musl configuration (static linking). Same x86-64-v2
# baseline as gnu: forcing +avx,+avx2 here SIGILLs on the Apollo Lake
# floor machines (no AVX at all).
[target.x86_64-unknown-linux-musl]
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "target-cpu=x86-64-v2",
]

# Linux ARM64 musl configuration (static linking)
[target.aarch64-unknown-linux-musl]
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "target-feature=+neon",
]
