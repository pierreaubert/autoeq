[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoeq-recording-gui"
version = "0.1.0"
description = "Recording wizard mirroring the sotf-capture workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gpui-toolkit>=0.9.30,<0.10"]

[project.scripts]
recording-gui = "recording_gui.__main__:main"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["recording_gui*"]
