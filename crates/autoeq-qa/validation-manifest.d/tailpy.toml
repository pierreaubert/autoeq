# autoeq-qa validation manifest fragment: tailpy group (PY01, PY02,
# PY03, PY04, PY05, H01, H02). Script/helper families as runner=python
# cases. One entry block per case; merged by the workflow owner into
# validation-manifest.toml. Stems are globally unique
# (<family>_<slug>, lowercase); ids are <stem-with-dashes>.v1.

[[case]]
id = "autoeq-qa.py01-dsp-smoothing.v1"
family = "PY01"
owner = "tailpy"
script = "py01_dsp_smoothing.wls"
golden = "py01_dsp_smoothing.json"
test = "py01_dsp_smoothing"
tolerance = "A: absolute error <= 1e-9 dB (triangular-log viewer smoothing)"
tolerance_kind = "abs"
tier = "smoke"
runner = "python"

[[case]]
id = "autoeq-qa.py02-band-statistics.v1"
family = "PY02"
owner = "tailpy"
script = "py02_band_statistics.wls"
golden = "py02_band_statistics.json"
test = "py02_band_statistics"
tolerance = "A: absolute error <= 1e-9 dB (band mean); empty band is None"
tolerance_kind = "abs"
tier = "smoke"
runner = "python"

[[case]]
id = "autoeq-qa.py03-roon-correlation.v1"
