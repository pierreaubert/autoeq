# autoeq-qa validation manifest: release-grade Wolfram comparisons.
#
# Only manifest-listed cases may support accuracy claims. Each case needs
# a `.wls` oracle, a checked-in golden (produced with
# `just qa-wolfram-goldens`), and a `tests/` comparison target below.
#
# Family ids (C01, C03, C06, ...) refer to reviews/catalogue-20260923.md.
# Every case resolves its reference through `autoeq_qa::require_reference`:
# a missing engine AND a missing golden fails the gate — it never passes
# by executing zero comparisons.

[[case]]
id = "autoeq-qa.peq-response.v1"
family = "C01"
owner = "autoeq-core"
script = "peq_response.wls"
golden = "peq_response.json"
test = "wolfram_peq_response"
tolerance = "complex relative error <= 1e-9"
tolerance_kind = "rel"
tolerance_value = 1e-09
tier = "smoke"

