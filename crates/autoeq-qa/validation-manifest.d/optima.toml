# autoeq-qa validation manifest fragment: optima group (O01-O04).
#
# Fragment of validation-manifest.toml owned by the optima lane. Each case
# needs its `.wls` oracle (wolfram/), engine-blessed golden
# (wolfram/goldens/), and comparison test (tests/wolfram_<stem>.rs).
# Tolerance class A throughout: direct f64 algebra in dB units, absolute
# error <= 1e-9 (O02 CVaR/variance reductions additionally pin exact
# small-population enumerations per class B at the same 1e-9 budget).

[[case]]
id = "autoeq-qa.o01-scalar-weights.v1"
family = "O01"
owner = "autoeq-optim"
script = "o01_scalar_weights.wls"
golden = "o01_scalar_weights.json"
test = "wolfram_o01_scalar_weights"
tolerance = "absolute error <= 1e-9 dB (ERB/band/combined/masked loss)"
tolerance_kind = "abs"
tier = "smoke"

[[case]]
id = "autoeq-qa.o01-asymmetric-weights.v1"
family = "O01"
owner = "autoeq-optim"
script = "o01_asymmetric_weights.wls"
golden = "o01_asymmetric_weights.json"
test = "wolfram_o01_asymmetric_weights"
tolerance = "absolute error <= 1e-9 dB (asymmetric combined loss)"
tolerance_kind = "abs"
tier = "smoke"

