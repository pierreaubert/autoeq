[package]
name = "autoeq"
version.workspace = true
description = "Automatic equalization for speakers, headphones and rooms!"
edition = "2024"
keywords = ["audio", "dsp", "eq"]
categories = ["multimedia::audio"]
repository = "https://github.com/pierreaubert/autoeq"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
license = "GPL-3.0-or-later"

[workspace]
resolver = "3"
members = [
    ".",
    "crates/autoeq-core",
    "crates/autoeq-artifacts",
    "crates/autoeq-fir",
    "crates/autoeq-plot",
    "crates/autoeq-measurements",
    "crates/autoeq-optim",
    "crates/autoeq-workflow",
    "crates/autoeq-cli",
    "crates/roomeq-model",
    "crates/roomeq-engine",
    "crates/roomeq-export",
    "crates/roomeq-quality",
    "crates/roomeq-qa",
    "crates/roomeq-cli",
    "crates/roomeq-analysis",
    "crates/roomeq-synthetic",
    "crates/roomeq-workflow",
]
# Keep the published crate under crates.io's size cap. The excluded paths are
# QA recordings, generated test fixtures, helper shell scripts, and editor
# backups — none are needed to compile the library or the user-facing
# binaries. The QA-only `roomeq-qa-features` binary and the
# `roomeq_generated_data_test` integration test will fail at runtime against
# a published copy because their fixtures are absent; they are meant to run
# from a workspace checkout.
exclude = [
    "data_tests/**",
    "data_generated/**",
    "scripts/**",
    "*~",
    "**/*~",
]

[workspace.package]
version = "0.5.58"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.dependencies]
autoeq-core = { path = "crates/autoeq-core", version = "0.5" }
autoeq-artifacts = { path = "crates/autoeq-artifacts", version = "0.5" }
autoeq-fir = { path = "crates/autoeq-fir", version = "0.5" }
autoeq-plot = { path = "crates/autoeq-plot", version = "0.5" }
autoeq-measurements = { path = "crates/autoeq-measurements", version = "0.5" }
autoeq-optim = { path = "crates/autoeq-optim", version = "0.5" }
autoeq-workflow = { path = "crates/autoeq-workflow", version = "0.5" }
autoeq-cli = { path = "crates/autoeq-cli", version = "0.5" }
roomeq-model = { path = "crates/roomeq-model", version = "0.5" }
roomeq-engine = { path = "crates/roomeq-engine", version = "0.5" }
roomeq-export = { path = "crates/roomeq-export", version = "0.5" }
roomeq-quality = { path = "crates/roomeq-quality", version = "0.5" }
roomeq-qa = { path = "crates/roomeq-qa", version = "0.5" }
roomeq-cli = { path = "crates/roomeq-cli", version = "0.5" }
roomeq-analysis = { path = "crates/roomeq-analysis", version = "0.5" }
roomeq-synthetic = { path = "crates/roomeq-synthetic", version = "0.5" }
roomeq-workflow = { path = "crates/roomeq-workflow", version = "0.5" }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
build_html = "2.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
criterion = "0.8"
csv = "1.4"
directories = "6"
env_logger = "0.11"
log = "0.4.28"
num_cpus = "1.17"
num-complex = "0.4"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
metaheuristics-nature = "10.1"
rustfft = "6.4"
hound = "3.5"
# `plotly` is gated behind the `plotly` feature (off by default). Library code
# under `src/plot/` and the `roomeq-fuzzer` binary require it; the main
# `autoeq` binary degrades gracefully and skips chart generation when off.
# currently we have compilation errors in 0.14.1
plotly = "0.13.3"
rand = "0.10.2"
rand_chacha = "0.10.0"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_ignored = "0.1.14"
serde_json = "1.0"
sha2 = "0.11"
schemars = "1.2"
strsim = "0.11"
thiserror = "2.0.17"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "io-util", "process", "signal"] }
urlencoding = "2.1"
zip = { version = "0.6.6", default-features = false }
tempfile = "3.23"
assert_fs = "1.0"
proptest = { version = "1.8", default-features = false, features = ["std"] }
serial_test = "4"
wide = "0.6.1"

# Math-Audio crates from GitHub
math-iir-fir = { git = "https://github.com/pierreaubert/math-audio", version = "0.5" }
math-dsp = { git = "https://github.com/pierreaubert/math-audio", version = "0.5" }
math-optimisation = { git = "https://github.com/pierreaubert/math-audio", version = "0.5" }
math-rir = { git = "https://github.com/pierreaubert/math-audio", version = "0.5" }
sofa-reader = "0.1"

# Core numerical computing
ndarray = { version = "0.17", default-features = false, features = ["rayon", "serde"] }
oxiblas-ndarray = "0.2.1"

# Optional, WebDriver-free static rendering. Charts are emitted as deterministic
# SVG and `resvg` rasterizes them in-process to PNG.
resvg = "0.46"
rayon = "1.11"

[dependencies]
autoeq-core = { workspace = true, version = "0.5" }
autoeq-artifacts = { workspace = true, version = "0.5" }
autoeq-fir = { workspace = true, version = "0.5" }
autoeq-plot = { workspace = true, optional = true, version = "0.5" }
autoeq-measurements = { workspace = true, version = "0.5" }
autoeq-optim = { workspace = true, version = "0.5" }
autoeq-workflow = { workspace = true, version = "0.5" }
autoeq-cli = { workspace = true, optional = true, version = "0.5" }
roomeq-model = { workspace = true, version = "0.5" }
roomeq-engine = { workspace = true, version = "0.5" }
roomeq-export = { workspace = true, version = "0.5" }
roomeq-quality = { workspace = true, version = "0.5" }
roomeq-qa = { workspace = true, optional = true, version = "0.5" }
roomeq-cli = { workspace = true, optional = true, version = "0.5" }
roomeq-analysis = { workspace = true, version = "0.5" }
roomeq-synthetic = { workspace = true, version = "0.5" }
roomeq-workflow = { workspace = true, version = "0.5" }
anyhow = { workspace = true, version = "0.5" }
plotly = { workspace = true, optional = true, version = "0.5" }
serde_json = { workspace = true, version = "0.5" }
math-iir-fir = { workspace = true, version = "0.5" }
math-optimisation = { workspace = true, version = "0.5" }

[features]
default = []
cli = ["dep:autoeq-cli", "dep:roomeq-cli"]
qa = ["cli", "dep:roomeq-qa"]
plotly = ["dep:plotly", "dep:autoeq-plot", "autoeq-plot/plotly", "autoeq-cli?/plotly"]
# Static PNG export has no browser, WebDriver, display-server, or network dependency.
plotly_static = ["plotly", "autoeq-plot/plotly_static", "autoeq-cli?/plotly_static"]

[target.'cfg(target_os = "macos")'.dependencies]

[target.'cfg(all(any(target_os = "ios", target_os="ios_sim"), target_arch = "aarch64"))'.dependencies]

[target.'cfg(all(target_os = "linux", target_arch="x86_64"))'.dependencies]

[target.'cfg(all(target_os = "linux", target_arch="aarch64"))'.dependencies]

[target.'cfg(all(target_os = "windows", target_arch="x86_64"))'.dependencies]

[target.'cfg(all(target_os = "windows", target_arch="aarch64"))'.dependencies]

[[bin]]
name = "autoeq"
path = "src/bin/autoeq/main.rs"
required-features = ["cli"]

[[bin]]
name = "benchmark-autoeq-speaker"
path = "src/bin/autoeq_benchmark_speaker.rs"
required-features = ["cli"]

[[bin]]
name = "autoeq-download-speakers"
path = "src/bin/autoeq_download_speaker.rs"
required-features = ["cli"]

[[bin]]
name = "roomeq"
path = "src/bin/roomeq/main.rs"
required-features = ["cli"]

[[bin]]
name = "roomeq-fuzzer"
path = "src/bin/roomeq_fuzzer.rs"
required-features = ["qa", "plotly"]

[[bin]]
name = "roomeq-qa-quality"
path = "src/bin/roomeq_qa_quality.rs"
required-features = ["qa"]

[[bin]]
name = "roomeq-qa-coverage"
path = "src/bin/roomeq_qa_coverage.rs"
required-features = ["qa"]

[[bin]]
name = "roomeq-qa-features"
path = "src/bin/roomeq_qa_features.rs"
required-features = ["qa"]

[[bin]]
name = "roomeq-qa-synthetic"
path = "src/bin/roomeq_qa_synthetic.rs"
required-features = ["qa"]

[[bin]]
name = "roomeq-qa-acoustic"
path = "src/bin/roomeq_qa_acoustic.rs"
required-features = ["qa"]

[[bin]]
name = "convert-recording"
path = "src/bin/convert_recording.rs"
required-features = ["cli"]

[lib]
name = "autoeq"
path = "src/lib.rs"

[[example]]
name = "headphone_loss_demo"
required-features = ["plotly"]

[[example]]
name = "headphone_loss_validation"

[dev-dependencies]
tempfile = { workspace = true }
assert_fs = { workspace = true }
clap = { workspace = true }
hound = { workspace = true }
ndarray = { workspace = true }
num-complex = { workspace = true }
proptest = { workspace = true }
rustfft = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[profile.release]
# `release` is the everyday optimised profile — used by CI, `just prod-*`,
# benchmarks, and local release iteration. Thin LTO keeps cross-crate inlining
# without the serial bottleneck of fat LTO, and 14 codegen units balance
# parallelism with optimiser visibility.
lto = "thin"
codegen-units = 14
panic = "unwind"

# `dist` is the "cut a release" profile. Inherits everything from `release`
# and tightens for maximum runtime performance at the cost of much longer
# compile time. Use via `cargo build --profile dist` — artifacts land in
# `target/dist/` instead of `target/release/`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
