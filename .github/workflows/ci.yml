name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-and-test:
    name: Check, Clippy and Unit Tests
    runs-on: ubuntu-latest
    outputs:
      crate-test-packages: ${{ steps.crate-test-matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check crate-partition architecture
        run: |
          python3 -m unittest scripts/test_check_crate_partition.py
          python3 scripts/check_crate_partition.py --baseline-ref "${{ github.event.pull_request.base.sha }}"

      - name: cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Check RoomEQ schema baselines
        run: python3 scripts/check_roomeq_schema_baselines.py
      - name: Test RoomEQ GPUI client
        run: |
          python3 -m pip install 'jsonschema>=4.25,<5'
          PYTHONPATH=python/roomeq-gui python3 -m unittest discover python/roomeq-gui/tests

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Prepare crate test matrix
        id: crate-test-matrix
        run: echo "packages=$(python3 scripts/run_crate_test_matrix.py --list-json)" >> "$GITHUB_OUTPUT"

  crate-unit-tests:
    name: Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: check-and-test
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check-and-test.outputs.crate-test-packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.package }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run focused crate tests
        run: python3 scripts/run_crate_test_matrix.py --package "${{ matrix.package }}" --release

  qa-roomeq-ci:
    name: RoomEQ CI QA Gate
    runs-on: ubuntu-latest
    needs: crate-unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Strict RoomEQ config and registry lint
        run: cargo test -p roomeq-qa strictly_deserialize --lib

      - name: Run deterministic RoomEQ correctness contracts
        run: just qa-roomeq-contract-pr

      - name: Run RoomEQ CI QA
        run: just qa-roomeq-ci

  qa-roomeq-macos:
    name: RoomEQ macOS Acoustic Baseline
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-roomeq-acoustic-${{ hashFiles('**/Cargo.lock') }}

      - name: Validate native macOS acoustic baseline and held-out gates
        run: cargo run --release --features qa --bin roomeq-qa-acoustic -- --tier pr --baseline data_tests/roomeq/acoustic_corpus/baseline.json

  coverage-gate:
    name: Library Unit-Test Coverage Gate (90 %)
    runs-on: ubuntu-latest
    needs: crate-unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Run coverage gate
        run: just qa-roomeq-coverage-gate
